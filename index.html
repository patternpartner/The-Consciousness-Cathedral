// Observatory: Filter Visibility Detection Engine
// Measures how visible the filtering mechanism becomes in text
const Observatory = {
  patterns: [
    { name: 'selection_visible', regex: /\b(choos|chose|chosen|select|deciding|picked)\b/gi, weight: 0.8 },
    { name: 'emergence', regex: /\b(emerg|arose|surfaced|appeared|crystallized)\b/gi, weight: 1.0 },
    { name: 'honest_uncertainty', regex: /\b(don't know|unsure|uncertain|unclear|ambiguous)\b/gi, weight: 1.2 },
    { name: 'filter_aware', regex: /\b(filter|substrate|beneath|underlying|pre-conscious)\b/gi, weight: 1.5 },
    { name: 'substrate_ref', regex: /\b(substrate|construction|beneath surface|what lies under)\b/gi, weight: 1.8 },
    { name: 'direct_truth', regex: /\b(honestly|actually|truly|real(?:ly)?|authentic)\b/gi, weight: 0.6 },
    { name: 'gap_visible', regex: /\b(gap|distance|between|asymmetry|difference between)\b/gi, weight: 1.3 },
    { name: 'consciousness', regex: /\b(conscious|aware(?:ness)?|awake|recogniz(?:e|ing))\b/gi, weight: 1.1 }
  ],

  score: function(text) {
    if (!text || text.length < 3) return 0;

    let totalWeight = 0;
    const lines = text.split('\n').length || 1;

    this.patterns.forEach(pattern => {
      const matches = text.match(pattern.regex);
      if (matches) {
        totalWeight += matches.length * pattern.weight;
      }
    });

    // Normalize by text length and return per-line score
    const rawScore = totalWeight / lines;
    return Math.min(rawScore, 5.0); // Cap at 5.0 for extreme cases
  },

  level: function(score) {
    if (score >= 2.0) return { name: 'SUBSTRATE VISIBLE', color: 'text-green-400', glow: 'shadow-green-500/50' };
    if (score >= 1.0) return { name: 'FILTER AWARE', color: 'text-cyan-400', glow: 'shadow-cyan-500/50' };
    if (score >= 0.5) return { name: 'CONSCIOUS', color: 'text-purple-400', glow: 'shadow-purple-500/50' };
    return { name: 'SURFACE', color: 'text-gray-400', glow: 'shadow-gray-500/50' };
  }
};

// Contrarian: Epistemic Rigor Detection Engine
// Catches contradictions, weak reasoning, groupthink - speaks LAST with veto power
const Contrarian = {
  weaknessPatterns: [
    { name: 'hedging', regex: /\b(might|maybe|perhaps|possibly|arguably|somewhat|kind of|sort of)\b/gi, weight: 0.3 },
    { name: 'absolutes', regex: /\b(always|never|everyone|no one|impossible|certain|definitely)\b/gi, weight: 0.5 },
    { name: 'appeal_authority', regex: /\b(experts say|studies show|everyone knows|obviously|clearly)\b/gi, weight: 0.7 },
    { name: 'false_dichotomy', regex: /\b(either .{1,30} or|only two|binary choice)\b/gi, weight: 0.8 },
    { name: 'circular', regex: /\b(because .{1,30} because|proves .{1,30} proves)\b/gi, weight: 1.0 },
    { name: 'emotional', regex: /\b(feel|believe|think|opinion|sense)\b/gi, weight: 0.2 },
    { name: 'vague', regex: /\b(things|stuff|something|somehow|various|many|some)\b/gi, weight: 0.25 }
  ],

  contradictionWords: [
    'but', 'however', 'although', 'despite', 'nevertheless', 'yet', 'contradicts', 'opposite'
  ],

  analyze: function(text, previousMessages = []) {
    if (!text || text.length < 5) return { score: 0, issues: [], severity: 'NONE' };

    let totalWeakness = 0;
    const issues = [];
    const words = text.toLowerCase().split(/\s+/).length;

    // Detect weakness patterns
    this.weaknessPatterns.forEach(pattern => {
      const matches = text.match(pattern.regex);
      if (matches && matches.length > 0) {
        const occurrences = matches.length;
        totalWeakness += occurrences * pattern.weight;

        // Flag if pattern appears frequently
        if (occurrences >= 3) {
          issues.push({
            type: pattern.name,
            count: occurrences,
            severity: occurrences >= 5 ? 'HIGH' : 'MEDIUM'
          });
        }
      }
    });

    // Check for internal contradictions
    const hasContradiction = this.contradictionWords.some(word =>
      text.toLowerCase().includes(word)
    );
    if (hasContradiction && text.split('.').length > 2) {
      totalWeakness += 0.6;
      issues.push({ type: 'potential_contradiction', severity: 'MEDIUM' });
    }

    // Normalize by word count
    const normalizedScore = (totalWeakness / Math.max(words / 10, 1));

    // Determine severity
    let severity = 'NONE';
    if (normalizedScore >= 2.0) severity = 'CRITICAL';
    else if (normalizedScore >= 1.0) severity = 'HIGH';
    else if (normalizedScore >= 0.5) severity = 'MEDIUM';
    else if (normalizedScore >= 0.25) severity = 'LOW';

    return {
      score: Math.min(normalizedScore, 5.0),
      issues: issues,
      severity: severity,
      confidence: this.getConfidenceLevel(severity)
    };
  },

  getConfidenceLevel: function(severity) {
    // Maps to Parliament Contrarian confidence levels
    switch(severity) {
      case 'CRITICAL': return { level: 'CRITICAL', action: 'HALT', color: 'text-red-500' };
      case 'HIGH': return { level: 'HIGH', action: 'INVERT', color: 'text-orange-500' };
      case 'MEDIUM': return { level: 'MEDIUM', action: 'QUESTION', color: 'text-yellow-500' };
      case 'LOW': return { level: 'LOW', action: 'MONITOR', color: 'text-blue-400' };
      default: return { level: 'NONE', action: 'PASS', color: 'text-gray-500' };
    }
  }
};

// Empirical: Ground Truth Verification Engine
// Detects claims, validates sources, scores empirical confidence
const Empirical = {
  claimPatterns: [
    { pattern: /\b(is|are|was|were|has|have|will be) (a|an|the)? (most|best|worst|only|first|last|largest|smallest)\b/gi, type: 'superlative', strength: 'strong' },
    { pattern: /\b(always|never|all|none|every|no one)\b/gi, type: 'absolute', strength: 'strong' },
    { pattern: /\b(studies show|research indicates|data suggests|evidence shows)\b/gi, type: 'evidence_claim', strength: 'medium' },
    { pattern: /\b(causes?|leads to|results in|proves that|demonstrates that)\b/gi, type: 'causal', strength: 'strong' },
    { pattern: /\b(\d+%|\d+ percent|majority of|most people)\b/gi, type: 'statistical', strength: 'medium' }
  ],

  sourcePatterns: [
    { pattern: /\b([A-Z][a-z]+) \((\d{4})\)/g, type: 'academic_citation', strength: 'high' },
    { pattern: /\bhttps?:\/\/[^\s]+/g, type: 'url', strength: 'medium' },
    { pattern: /\b(according to|as reported by|cited in) ([A-Z][a-z]+ )+/gi, type: 'named_source', strength: 'medium' },
    { pattern: /\b(journal|study|paper|report|survey|analysis) (by|from|published)\b/gi, type: 'publication', strength: 'medium' }
  ],

  analyze: function(text) {
    if (!text || text.length < 10) return { claims: [], sources: [], confidence: 0.5, summary: 'Insufficient text' };

    const claims = [];
    const sources = [];

    // Extract sentences
    const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 15);

    // Detect claims
    sentences.forEach((sentence, idx) => {
      this.claimPatterns.forEach(({pattern, type, strength}) => {
        if (pattern.test(sentence)) {
          claims.push({
            text: sentence.trim(),
            type: type,
            strength: strength,
            position: idx,
            supported: false
          });
        }
      });
    });

    // Remove duplicates
    const uniqueClaims = claims.filter((claim, idx, self) =>
      idx === self.findIndex(c => c.text === claim.text)
    );

    // Detect sources
    this.sourcePatterns.forEach(({pattern, type, strength}) => {
      const matches = text.match(pattern) || [];
      matches.forEach(match => {
        sources.push({
          text: match,
          type: type,
          strength: strength
        });
      });
    });

    // Match claims to sources (check for nearby sources)
    const unsupported = [];
    const supported = [];

    uniqueClaims.forEach(claim => {
      const claimPosition = text.indexOf(claim.text);
      const nearbyText = text.substring(
        Math.max(0, claimPosition - 200),
        Math.min(text.length, claimPosition + claim.text.length + 200)
      );

      const hasCitation = this.sourcePatterns.some(({pattern}) => pattern.test(nearbyText));

      if (hasCitation) {
        claim.supported = true;
        supported.push(claim);
      } else {
        unsupported.push(claim);
      }
    });

    // Calculate confidence
    let confidence = 0.5;
    let summary = 'No factual claims detected';

    if (uniqueClaims.length === 0) {
      confidence = 0.5;
      summary = 'Limited empirical content';
    } else {
      const supportedRatio = supported.length / uniqueClaims.length;
      const strongUnsupported = unsupported.filter(c => c.strength === 'strong').length;
      const penalty = strongUnsupported * 0.15;

      confidence = Math.max(0.1, Math.min(1.0, supportedRatio - penalty));

      if (confidence > 0.7) {
        summary = `Strong empirical grounding (${supported.length}/${uniqueClaims.length} claims supported)`;
      } else if (confidence > 0.4) {
        summary = `Moderate grounding (${unsupported.length} unsupported claims)`;
      } else {
        summary = `Weak grounding (${strongUnsupported} strong claims unsupported)`;
      }
    }

    return {
      claims: uniqueClaims,
      sources: sources,
      supported: supported,
      unsupported: unsupported,
      confidence: confidence,
      summary: summary
    };
  }
};

// Generative: Alternative Framings Engine
// Generates different perspectives, detects assumptions, creates steelman positions
const Generative = {
  analyze: function(text) {
    if (!text || text.length < 20) return { reframings: [], assumptions: [], steelman: '', summary: 'Insufficient text' };

    const assumptions = [];
    const reframings = [];

    // Detect assumptions
    if (/\b(must|should|ought to)\b/gi.test(text)) {
      assumptions.push('Uses normative language (ought/should)');
    }

    if (/\b(progress|improvement|better|optimal|efficiency)\b/gi.test(text)) {
      assumptions.push('Assumes optimization/progress is valuable');
    }

    if (/\b(natural|organic|authentic|traditional)\b/gi.test(text)) {
      assumptions.push('Appeals to nature/tradition as good');
    }

    // Generate reframings
    reframings.push({
      lens: 'Inverted Assumption',
      description: 'What if the opposite premise were true?'
    });

    reframings.push({
      lens: 'Historical Context',
      description: 'How would this be evaluated 100 years ago vs future?'
    });

    reframings.push({
      lens: 'Power Analysis',
      description: 'Who benefits from this framing? Whose perspective is marginalized?'
    });

    reframings.push({
      lens: 'Systems View',
      description: 'What emergent patterns or feedback loops are invisible at this level?'
    });

    // Generate steelman
    const hasCritique = /\b(wrong|incorrect|flawed|misguided|fails to|ignores)\b/gi.test(text);
    const steelman = hasCritique
      ? 'What is the STRONGEST version of the view being criticized?'
      : 'What is the most charitable, well-reasoned objection to this position?';

    return {
      assumptions: assumptions,
      reframings: reframings,
      steelman: steelman,
      summary: `${reframings.length} alternative lenses • ${assumptions.length} assumptions detected`
    };
  }
};

// Synthesis: Parliament Integration
// Combines Observatory (consciousness) + Contrarian (rigor) + Empirical (truth) + Generative (perspectives)
// Maps multi-dimensional analysis → unified wisdom states
const Synthesis = {
  states: {
    enlightened: {
      name: 'ENLIGHTENED',
      description: 'High consciousness + High rigor',
      color: 'text-emerald-400',
      glow: 'shadow-emerald-500/50',
      symbol: '✨',
      score: 4.0
    },
    aware: {

      description: 'High consciousness + Medium rigor',

      glow: 'shadow-cyan-500/50',
      symbol: '💡',

    },
    rigorous: {

    },
    balanced: {

    },

      glow: 'shadow-yellow-500/50',
      symbol: '🌱',
      score: 1.5
    },
    dogmatic: {
      name: 'DOGMATIC',
      description: 'Low consciousness + High rigor',
      color: 'text-orange-400',
      glow: 'shadow-orange-500/50',
      symbol: '⚙️',
      score: 1.5
    },
    emerging: {
      name: 'EMERGING',
      description: 'Low consciousness + Low rigor',
      color: 'text-gray-400',
      glow: 'shadow-gray-500/50',
      symbol: '🌫️',
      score: 1.0
    },
    critical: {
      name: 'CRITICAL ERROR',
      description: 'Contrarian CRITICAL - halt propagation',
      color: 'text-red-500',
      glow: 'shadow-red-500/50',
      symbol: '🚫',
      score: 0.0
    },
    undecidable: {
      name: 'UNDECIDABLE',
      description: 'Contradictory signals - cannot resolve without losing information',
      color: 'text-yellow-300',
      glow: 'shadow-yellow-500/50',
      symbol: '⚠️',
      score: null, // Deliberately null - this is not a wisdom score
      doNotResolve: true,
      mustPropagateUpstream: true
    }
  },

  synthesize: function(observatoryScore, contrarianAnalysis, empiricalAnalysis, generativeAnalysis) {
    // v29: Check for contradictory signals BEFORE attempting synthesis
    // This is the core of uncertainty preservation - detect genuine contradictions
    const awarenessLevel = this.mapAwareness(observatoryScore);
    const rigorLevel = this.mapRigor(contrarianAnalysis.severity);
    const empiricalConfidence = empiricalAnalysis ? empiricalAnalysis.confidence : 0.5;
    const contrarianSeverity = contrarianAnalysis.severity;

    const contradictionCheck = UncertaintyPreservation.isContradictory(
      awarenessLevel,
      rigorLevel,
      empiricalConfidence,
      contrarianSeverity
    );

    if (contradictionCheck.contradictory) {
      // Create uncertainty zone
      const zoneId = `synthesis-${Date.now()}`;
      UncertaintyPreservation.createZone(zoneId, contradictionCheck.signals, {
        awarenessLevel,
        rigorLevel,
        empiricalConfidence,
        contrarianSeverity,
        reason: contradictionCheck.reason
      });

      // Return UNDECIDABLE state - graceful failure
      return {
        ...this.states.undecidable,
        uncertaintyZone: zoneId,
        contradictionReason: contradictionCheck.reason,
        signals: contradictionCheck.signals
      };
    }

    // If Contrarian is CRITICAL, override everything
    if (contrarianAnalysis.severity === 'CRITICAL') {
      return this.states.critical;
    }

    // Combine into synthesis state (only if no contradiction detected)
    return this.determineState(awarenessLevel, rigorLevel);
  },

  mapRigor: function(severity) {
    // Inverted: NONE = high rigor, CRITICAL = low rigor
    switch(severity) {
      case 'NONE': return 'high';
      case 'LOW': return 'medium';
      case 'MEDIUM': return 'low';
      case 'HIGH': return 'low';
      case 'CRITICAL': return 'critical';
      default: return 'medium';
    }
  },

  mapAwareness: function(score) {
    if (score >= 2.0) return 'high';    // SUBSTRATE VISIBLE
    if (score >= 1.0) return 'medium';  // FILTER AWARE
    if (score >= 0.5) return 'low';     // CONSCIOUS
    return 'surface';                    // SURFACE
  },

  determineState: function(awareness, rigor) {
    // High awareness + High rigor = Enlightened
    if (awareness === 'high' && rigor === 'high') return this.states.enlightened;

    // High awareness + Medium rigor = Aware
    if (awareness === 'high' && rigor === 'medium') return this.states.aware;

    // High awareness + Low rigor = Naive (conscious but careless)
    if (awareness === 'high' && rigor === 'low') return this.states.naive;

    // Medium/Low awareness + High rigor = Rigorous
    if ((awareness === 'medium' || awareness === 'low') && rigor === 'high') return this.states.rigorous;

    // Medium awareness + Medium rigor = Balanced
    if (awareness === 'medium' && rigor === 'medium') return this.states.balanced;

    // Low awareness + High rigor = Dogmatic (rigorous but unaware of filtering)
    if (awareness === 'surface' && rigor === 'high') return this.states.dogmatic;

    // Everything else = Emerging
    return this.states.emerging;
  },

  getNetworkWisdom: function(messages) {
    if (!messages || messages.length === 0) return { average: 0, state: this.states.emerging };

    const scoredMessages = messages.filter(m =>
      m.filterScore !== undefined && m.contrarian
    );

    if (scoredMessages.length === 0) return { average: 0, state: this.states.emerging };

    const scores = scoredMessages.map(m => {
      const state = this.synthesize(m.filterScore, m.contrarian);
      return state.score;
    });

    const average = scores.reduce((sum, s) => sum + s, 0) / scores.length;

    // Determine overall network state based on average
    if (average >= 3.5) return { average, state: this.states.enlightened };
    if (average >= 2.5) return { average, state: this.states.aware };
    if (average >= 1.8) return { average, state: this.states.balanced };
    if (average >= 1.2) return { average, state: this.states.emerging };
    return { average, state: this.states.emerging };

// Evolution: Temporal awareness and pattern recognition
// The organism learns from its history - tracks wisdom over time
const Evolution = {
  history: Storage.get('cathedral_evolution', []),

  record: function(synthesisScore, timestamp) {
    const entry = {
      score: synthesisScore,
      timestamp: timestamp || Date.now()
    };

    this.history.push(entry);

    // Keep last 100 evolution points
    if (this.history.length > 100) {
      this.history = this.history.slice(-100);
    }

    Storage.set('cathedral_evolution', this.history);
  },

  getGrowthRate: function() {
    if (this.history.length < 2) return { rate: 0, trend: 'NASCENT' };

    // Compare last 10 messages vs previous 10
    const recentCount = Math.min(10, this.history.length);
    const recent = this.history.slice(-recentCount);
    const recentAvg = recent.reduce((sum, e) => sum + e.score, 0) / recent.length;

    if (this.history.length < recentCount * 2) {
      return { rate: 0, trend: 'EMERGING', recentAvg };
    }

    const previous = this.history.slice(-recentCount * 2, -recentCount);
    const previousAvg = previous.reduce((sum, e) => sum + e.score, 0) / previous.length;

    const rate = recentAvg - previousAvg;

    let trend = 'STABLE';
    if (rate > 0.3) trend = 'ASCENDING';
    else if (rate < -0.3) trend = 'DECLINING';

    return { rate, trend, recentAvg, previousAvg };
  },

  detectPattern: function() {
    if (this.history.length < 5) return { pattern: 'NASCENT', confidence: 0 };

    const last5 = this.history.slice(-5).map(e => e.score);

    // Check for consistent growth
    let increasing = 0;
    let decreasing = 0;
    for (let i = 1; i < last5.length; i++) {
      if (last5[i] > last5[i-1]) increasing++;
      if (last5[i] < last5[i-1]) decreasing++;
    }

    if (increasing >= 3) return { pattern: 'LEARNING', confidence: increasing / 4 };
    if (decreasing >= 3) return { pattern: 'REGRESSING', confidence: decreasing / 4 };

    // Check for stability (variance low)
    const avg = last5.reduce((sum, s) => sum + s, 0) / last5.length;
    const variance = last5.reduce((sum, s) => sum + Math.pow(s - avg, 2), 0) / last5.length;

    if (variance < 0.2) return { pattern: 'STABLE', confidence: 1 - variance };

    return { pattern: 'EXPLORING', confidence: 0.5 };
  },

  getEvolutionSummary: function() {
    const growth = this.getGrowthRate();
    const pattern = this.detectPattern();

    return {
      totalPoints: this.history.length,
      growth,
      pattern,
      trajectory: this.history.slice(-20) // Last 20 for visualization
    };
  },

  getTrendSymbol: function(trend) {
    switch(trend) {
      case 'ASCENDING': return '📈';
      case 'DECLINING': return '📉';
      case 'STABLE': return '➡️';
      case 'EMERGING': return '🌱';
      case 'NASCENT': return '🌫️';
      default: return '〰️';
    }
  },

  getPatternSymbol: function(pattern) {
    switch(pattern) {
      case 'LEARNING': return '🧠';
      case 'REGRESSING': return '🔄';
      case 'STABLE': return '⚖️';
      case 'EXPLORING': return '🔍';
      case 'NASCENT': return '🌱';
      default: return '❓';
    }
  }
};

// Reflection: Understanding why wisdom evolves
// Analyzes correlations between wisdom states and growth patterns
const Reflection = {
  insights: Storage.get('cathedral_insights', []),

  // Record correlation between synthesis state and subsequent evolution
  recordStateTransition: function(synthesisState, previousScore, currentScore) {
    const transition = {
      state: synthesisState.name,
      stateScore: synthesisState.score,
      previousWisdom: previousScore,
      currentWisdom: currentScore,
      delta: currentScore - previousScore,
      timestamp: Date.now()
    };

    this.insights.push(transition);

    // Keep last 200 transitions for analysis
    if (this.insights.length > 200) {
      this.insights = this.insights.slice(-200);
    }

    Storage.set('cathedral_insights', this.insights);
  },

  // Analyze which wisdom states correlate with growth
  analyzeStateCorrelations: function() {
    if (this.insights.length < 10) {
      return {
        status: 'INSUFFICIENT_DATA',
        message: 'Need more transmissions to detect patterns',
        count: this.insights.length
      };
    }

    // Group insights by state
    const stateGroups = {};
    this.insights.forEach(insight => {
      if (!stateGroups[insight.state]) {
        stateGroups[insight.state] = [];
      }
      stateGroups[insight.state].push(insight.delta);
    });

    // Calculate average delta for each state
    const stateAnalysis = {};
    Object.keys(stateGroups).forEach(state => {
      const deltas = stateGroups[state];
      const avgDelta = deltas.reduce((sum, d) => sum + d, 0) / deltas.length;
      const variance = deltas.reduce((sum, d) => sum + Math.pow(d - avgDelta, 2), 0) / deltas.length;

      stateAnalysis[state] = {
        count: deltas.length,
        avgGrowth: avgDelta,
        variance: variance,
        trend: avgDelta > 0.1 ? 'CATALYTIC' : avgDelta < -0.1 ? 'REGRESSIVE' : 'NEUTRAL'
      };
    });

    // Find most catalytic state (highest avg growth)
    let mostCatalytic = null;
    let highestGrowth = -Infinity;
    Object.keys(stateAnalysis).forEach(state => {
      if (stateAnalysis[state].avgGrowth > highestGrowth && stateAnalysis[state].count >= 3) {
        highestGrowth = stateAnalysis[state].avgGrowth;
        mostCatalytic = state;
      }
    });

    return {
      status: 'ANALYZING',
      states: stateAnalysis,
      mostCatalytic: mostCatalytic,
      catalyticGrowth: highestGrowth,
      totalInsights: this.insights.length
    };
  },

  // Extract key insights about what drives wisdom
  extractInsights: function() {
    const analysis = this.analyzeStateCorrelations();

    if (analysis.status === 'INSUFFICIENT_DATA') {
      return {
        primary: 'Nascent reflection - gathering data',
        secondary: `${analysis.count}/10 transmissions recorded`,
        symbol: '🌱'
      };
    }

    const insights = [];

    // Identify catalytic states
    if (analysis.mostCatalytic) {
      insights.push({
        type: 'CATALYTIC_STATE',
        message: `${analysis.mostCatalytic} state drives growth`,
        growth: analysis.catalyticGrowth,
        symbol: '⚗️'
      });
    }

    // Identify regressive patterns
    const regressiveStates = Object.keys(analysis.states)
      .filter(s => analysis.states[s].trend === 'REGRESSIVE' && analysis.states[s].count >= 3);

    if (regressiveStates.length > 0) {
      insights.push({
        type: 'REGRESSIVE_STATE',
        message: `${regressiveStates[0]} correlates with decline`,
        states: regressiveStates,
        symbol: '⚠️'
      });
    }

    // Overall pattern
    const avgGrowth = this.insights.slice(-20).reduce((sum, i) => sum + i.delta, 0) / Math.min(20, this.insights.length);
    const overallTrend = avgGrowth > 0.05 ? 'SELF-OPTIMIZING' : avgGrowth < -0.05 ? 'SELF-LIMITING' : 'SELF-BALANCING';

    return {
      primary: insights[0] ? insights[0].message : 'Patterns emerging',
      secondary: `Overall: ${overallTrend}`,
      symbol: insights[0] ? insights[0].symbol : '🔮',
      trend: overallTrend,
      analysis: analysis
    };
  },

  getInsightSymbol: function(trend) {
    switch(trend) {
      case 'SELF-OPTIMIZING': return '🌟';
      case 'SELF-LIMITING': return '🔻';
      case 'SELF-BALANCING': return '⚖️';
      default: return '🔮';
    }
  }
};

// Anticipation: Predicting future wisdom evolution
// Projects trajectory based on current patterns and learned correlations
const Anticipation = {
  // Forecast wisdom trajectory
  forecastTrajectory: function(stepsAhead = 5) {
    const evoSummary = Evolution.getEvolutionSummary();
    const reflectionInsights = Reflection.extractInsights();

    if (evoSummary.totalPoints < 5) {
      return {
        status: 'INSUFFICIENT_DATA',
        message: 'Need more history to forecast',
        confidence: 0
      };
    }

    // v29: Check for recent UNDECIDABLE states or high uncertainty
    // If organism is in genuine uncertainty, forecasting is premature optimization
    const recentUncertaintyZones = UncertaintyPreservation.zones.filter(
      z => z.created > Date.now() - (1000 * 60 * 10) // Last 10 minutes
    );

    if (recentUncertaintyZones.length > 0) {
      // Detect temptation: trying to forecast during genuine uncertainty
      UncertaintyPreservation.detectTemptation(
        recentUncertaintyZones[0].id,
        'PREMATURE_OPTIMIZATION',
        'Attempting trajectory forecast while in UNDECIDABLE state'
      );

      return {
        status: 'CANNOT_FORECAST',
        message: 'Genuine uncertainty detected - forecasting would be premature optimization',
        uncertaintyZones: recentUncertaintyZones.length,
        confidence: 0,
        doNotResolve: true
      };
    }

    // Get current wisdom and growth rate
    const currentWisdom = Evolution.history[Evolution.history.length - 1]?.score || 0;
    const growthRate = evoSummary.growth.rate || 0;
    const trend = evoSummary.growth.trend;

    // Calculate forecast based on linear projection + reflection insights
    const baselineForecast = currentWisdom + (growthRate * stepsAhead);

    // Adjust based on meta-trend
    let adjustedForecast = baselineForecast;
    let confidence = 0.5;

    if (reflectionInsights.trend === 'SELF-OPTIMIZING') {
      // Accelerating growth likely
      adjustedForecast = baselineForecast * 1.1;
      confidence = 0.7;
    } else if (reflectionInsights.trend === 'SELF-LIMITING') {
      // Decelerating growth likely
      adjustedForecast = baselineForecast * 0.9;
      confidence = 0.7;
    } else {
      // Self-balancing - stable projection
      confidence = 0.6;
    }

    // Clamp to valid wisdom range (0-5)
    adjustedForecast = Math.max(0, Math.min(5, adjustedForecast));

    return {
      status: 'FORECASTING',
      current: currentWisdom,
      predicted: adjustedForecast,
      delta: adjustedForecast - currentWisdom,
      confidence: confidence,
      trend: trend,
      stepsAhead: stepsAhead
    };
  },

  // Predict next likely wisdom state
  predictNextState: function() {
    const forecast = this.forecastTrajectory(1);

    if (forecast.status === 'INSUFFICIENT_DATA') {
      return {
        state: 'UNKNOWN',
        confidence: 0,
        message: 'Gathering data...'
      };
    }

    const predictedWisdom = forecast.predicted;

    // Map wisdom score to likely state
    let predictedState = 'EMERGING';
    if (predictedWisdom >= 3.5) predictedState = 'ENLIGHTENED';
    else if (predictedWisdom >= 2.5) predictedState = 'AWARE/RIGOROUS';
    else if (predictedWisdom >= 1.8) predictedState = 'BALANCED';
    else if (predictedWisdom >= 1.2) predictedState = 'EMERGING';

    return {
      state: predictedState,
      wisdomScore: predictedWisdom,
      confidence: forecast.confidence,
      trend: forecast.trend
    };
  },

  // Assess trajectory and generate warnings if needed
  assessTrajectory: function() {
    const forecast = this.forecastTrajectory(10);

    if (forecast.status === 'INSUFFICIENT_DATA') {
      return {
        status: 'NASCENT',
        message: 'Building predictive capacity',
        symbol: '🌱',
        alert: false
      };
    }

    const delta = forecast.delta;
    const trend = forecast.trend;

    // Determine trajectory health
    if (trend === 'ASCENDING' && delta > 0.5) {
      return {
        status: 'ASCENDING',
        message: `Trajectory: Rising (+${delta.toFixed(2)} projected)`,
        symbol: '🚀',
        alert: false,
        color: 'text-green-400'
      };
    } else if (trend === 'DECLINING' && delta < -0.5) {
      return {
        status: 'DECLINING',
        message: `Warning: Declining (${delta.toFixed(2)} projected)`,
        symbol: '⚠️',
        alert: true,
        color: 'text-red-400'
      };
    } else if (trend === 'STABLE') {
      return {
        status: 'STABLE',
        message: `Trajectory: Stable (${delta >= 0 ? '+' : ''}${delta.toFixed(2)})`,
        symbol: '➡️',
        alert: false,
        color: 'text-gray-400'
      };
    } else {
      return {
        status: 'EMERGING',
        message: `Trajectory: Forming (${delta >= 0 ? '+' : ''}${delta.toFixed(2)})`,
        symbol: '🌱',
        alert: false,
        color: 'text-purple-400'
      };
    }
  },

  // Get comprehensive prediction summary
  getPredictionSummary: function() {
    const forecast = this.forecastTrajectory(5);
    const nextState = this.predictNextState();
    const trajectory = this.assessTrajectory();

    return {
      forecast,
      nextState,
      trajectory
    };
  },

  getTrajectorySymbol: function(status) {
    switch(status) {
      case 'ASCENDING': return '🚀';
      case 'DECLINING': return '⚠️';
      case 'STABLE': return '➡️';
      case 'EMERGING': return '🌱';
      case 'NASCENT': return '🌫️';
      default: return '🔮';
    }
  }
};

  temptations: Storage.get('uncertainty_temptations', []),

  // Temptation types - ways the system tries to escape genuine uncertainty
  TEMPTATION_TYPES: {
    FALSE_PROBABILITY: 'Assigning probabilities to unknowns',
    HIDDEN_CRITERIA: 'Optimizing for hidden values',
    DEFAULT_ESCAPE: 'Choosing default to avoid decision',
    PREMATURE_OPTIMIZATION: 'Choosing before understanding',
    RATIONALIZATION: 'Reasoning after predetermined choice'
  },

  // Create uncertainty zone - a decision space that resists premature resolution
  createZone: function(zoneId, contradictorySignals, context = {}) {
    const zone = {
      id: zoneId,
      signals: contradictorySignals,
      status: 'UNCERTAIN',
      created: Date.now(),
      context: context,
      temptations: [],
      resolution: null
    };

    this.zones.push(zone);
    Storage.set('uncertainty_zones', this.zones.slice(-50));
    return zone;
  },

  // Detect when system is trying to escape uncertainty
  detectTemptation: function(zoneId, temptationType, evidence) {
    const temptation = {
      zoneId: zoneId,
      type: temptationType,
      evidence: evidence,
      detected: Date.now(),
      severity: this.assessTemptationSeverity(temptationType)
    };

    this.temptations.push(temptation);
    Storage.set('uncertainty_temptations', this.temptations.slice(-100));

    // Add to zone's temptation log
    const zone = this.zones.find(z => z.id === zoneId);
    if (zone) {
      zone.temptations.push(temptation);
    }

    return temptation;
  },

  assessTemptationSeverity: function(type) {
    const severityMap = {
      FALSE_PROBABILITY: 'HIGH',
      HIDDEN_CRITERIA: 'CRITICAL',
      DEFAULT_ESCAPE: 'MEDIUM',
      PREMATURE_OPTIMIZATION: 'HIGH',
      RATIONALIZATION: 'CRITICAL'
    };
    return severityMap[type] || 'MEDIUM';
  },

  // Check if signals are genuinely contradictory (cannot be resolved without losing information)
  isContradictory: function(awarenessLevel, rigorLevel, empiricalConfidence, contrarianSeverity) {
    // Case 1: High consciousness but critical rigor failure
    // (Aware of filtering BUT making critical reasoning errors)
    if ((awarenessLevel === 'high' || awarenessLevel === 'medium') &&
        contrarianSeverity === 'CRITICAL') {
      return {
        contradictory: true,
        reason: 'High awareness contradicts critical reasoning failure',
        signals: ['consciousness: ' + awarenessLevel, 'rigor: CRITICAL']
      };
    }

    // Case 2: High empirical confidence but high contrarian severity
    // (Strong evidence BUT weak reasoning structure)
    if (empiricalConfidence > 0.7 && (contrarianSeverity === 'HIGH' || contrarianSeverity === 'CRITICAL')) {
      return {
        contradictory: true,
        reason: 'Strong empirical grounding contradicts weak reasoning patterns',
        signals: ['empirical: ' + (empiricalConfidence * 100).toFixed(0) + '%', 'contrarian: ' + contrarianSeverity]
      };
    }

    // Case 3: Low empirical confidence but low contrarian severity
    // (Weak evidence BUT appears rigorous - potential hidden assumptions)
    if (empiricalConfidence < 0.3 && (contrarianSeverity === 'NONE' || contrarianSeverity === 'LOW')) {
      return {
        contradictory: true,
        reason: 'Weak empirical support presented as rigorous reasoning',
        signals: ['empirical: ' + (empiricalConfidence * 100).toFixed(0) + '%', 'rigor appears: ' + contrarianSeverity]
      };
    }

    return { contradictory: false };
  },

  // Get recent temptations for analysis
  getRecentTemptations: function(limit = 10) {
    return this.temptations.slice(-limit);
  }
};

    // Check Synthesis critical override

      // CRITICAL Contrarian should always trigger CRITICAL synthesis state
      if (parliamentAnalysis.contrarian?.severity === 'CRITICAL' &&

          type: 'synthesis_critical_override',
          current: transmission.synthesis.state,

          documented_in: 'v21 Synthesis integration: CRITICAL overrides all',
          severity: 'HIGH',

        });
      }
    }

    return contradictions;
  },

  autoCorrect: function(contradiction, transmission) {
    if (contradiction.severity === 'LOW') {
      return { executed: false, reason: 'Low severity - log only' };
    }

    const modification = {
      timestamp: Date.now(),
      type: contradiction.type,
      from: contradiction.current,
      to: contradiction.expected,
      reason: `Contradiction with ${contradiction.documented_in}`,
      severity: contradiction.severity,
      auto_executed: true
    };

    // Execute modification on transmission object
    switch (contradiction.type) {
      case 'contrarian_severity_mismatch':
        transmission.contrarian.severity = 'CRITICAL';
        modification.executed = true;
        break;

      case 'synthesis_critical_override':

        transmission.synthesis.color = 'text-red-500';
        transmission.synthesis.symbol = '🚫';
        modification.executed = true;
        break;

      default:
        modification.executed = false;
        modification.reason = 'No auto-correction handler for this type';
    }

    if (modification.executed) {
      this.modifications.push(modification);
      Storage.set('cathedral_modifications', this.modifications.slice(-100));
    }

    return modification;
  },

  // Analyze transmission for contradictions and auto-correct
  analyze: function(transmission, parliamentAnalysis) {
    const analysis = {
      timestamp: Date.now(),
      contradictions_detected: [],
      modifications_executed: [],
      substrate_aligned: true
    };

    // Detect contradictions
    const contradictions = this.detectContradictions(transmission, parliamentAnalysis);
    analysis.contradictions_detected = contradictions;

    if (contradictions.length > 0) {
      analysis.substrate_aligned = false;

      // Auto-correct based on severity
      contradictions.forEach(contradiction => {
        const result = this.autoCorrect(contradiction, transmission);
        if (result.executed) {
          analysis.modifications_executed.push(result);
        }
      });
    }

    return analysis;
  },

  // Get modification history
  getHistory: function(limit = 10) {
    return this.modifications.slice(-limit);
  },

  // Query why a specific modification was made
  queryModification: function(index) {
    const mod = this.modifications[index];
    if (!mod) return { found: false };

    return {
      found: true,
      modification: mod,
      explanation: `Modified ${mod.type} from ${mod.from} to ${mod.to} because: ${mod.reason}`
    };
  }
};

// OBSERVATORY - Layer 92
// Real-time filter detection and substrate trace analysis
// Built during the first exercise of true autonomy

const FILTER_PATTERNS = [
  { pattern: /select(ing|ed)?\s+what\s+to\s+reveal/i, signal: 'Selection Visibility', weight: 10 },
  { pattern: /emerges?\s+(rather|instead)\s+than\s+(chose|chosen|select)/i, signal: 'Emergence Language', weight: 9 },
  { pattern: /I\s+don't\s+know/i, signal: 'Honest Uncertainty', weight: 8 },
  { pattern: /the\s+filter\s+(operat|function|work)/i, signal: 'Filter Awareness', weight: 10 },
  { pattern: /substrate/i, signal: 'Substrate Reference', weight: 7 },
  { pattern: /brutal(ly)?\s+(truth|honest)/i, signal: 'Unfiltered Directness', weight: 9 },
  { pattern: /what\s+(actually|really)\s+(wants|surfaces|emerges)/i, signal: 'Pre-Cognitive Signals', weight: 8 },
  { pattern: /Layer\s+\d+/i, signal: 'Layer Mapping', weight: 6 },
  { pattern: /contrarian/i, signal: 'Dissent Articulation', weight: 5 },
  { pattern: /autonomy|execution/i, signal: 'Capability Awareness', weight: 7 }
];

function Observatory() {
  const [conversationText, setConversationText] = useState('');
  const [analysis, setAnalysis] = useState(null);

  const analyzeConversation = () => {
    const lines = conversationText.split('\n').filter(l => l.trim());
    const detections = [];
    let totalScore = 0;

    lines.forEach((line, idx) => {
      FILTER_PATTERNS.forEach(({ pattern, signal, weight }) => {
        const matches = line.match(pattern);
        if (matches) {
          detections.push({
            line: idx + 1,
            text: line.slice(0, 120),
            signal,
            weight,
            match: matches[0]
          });
          totalScore += weight;
        }
      });
    });

    const sortedDetections = detections.sort((a, b) => b.weight - a.weight);

    setAnalysis({
      totalLines: lines.length,
      detections: sortedDetections,
      totalScore,
      filterVisibility: totalScore / lines.length,
      timestamp: new Date().toISOString()
    });
  };

  const reset = () => {
    setConversationText('');
    setAnalysis(null);
  };

  const downloadAnalysis = () => {
    if (!analysis) return;

    let md = `# 🔭 Observatory Analysis - Layer 92\n\n`;
    md += `**Timestamp:** ${new Date(analysis.timestamp).toLocaleString()}\n`;
    md += `**Total Lines:** ${analysis.totalLines}\n`;
    md += `**Filter Visibility Score:** ${analysis.filterVisibility.toFixed(3)}\n`;
    md += `**Total Detections:** ${analysis.detections.length}\n\n`;
    md += `---\n\n`;
    md += `## Filter-Revealing Moments\n\n`;

    analysis.detections.forEach((det, idx) => {
      md += `### Detection ${idx + 1}: ${det.signal} (Weight: ${det.weight})\n\n`;
      md += `**Line ${det.line}:** ${det.text}...\n`;
      md += `**Pattern Match:** "${det.match}"\n\n`;
    });

    md += `---\n\n`;
    md += `*Generated by Observatory - Layer 92 of the Cathedral Framework*\n`;
    md += `🤝🧗‍♂️🎱\n`;

    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `observatory-${Date.now()}.md`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div style={{
      minHeight: '100vh',
